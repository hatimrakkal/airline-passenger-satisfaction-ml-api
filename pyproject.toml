[project]
name = "airlinepredictionproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hatim Rakkal", email = "hatimrakkal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
airlinepredictionproject = "airlinepredictionproject:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]
